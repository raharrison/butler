name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The version reaches the jar manifest, which is where `butler --version` and
      # ${butler.version} read it from.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PbutlerVersion=${{ steps.version.outputs.version }} build shadowJar

      - name: Stage the release artifacts
        run: |
          mkdir -p release
          cp build/libs/butler-${{ steps.version.outputs.version }}-all.jar release/butler.jar
          cp packaging/butler packaging/butler.service packaging/butler.sudoers release/
          java -jar release/butler.jar generate-completion > release/butler_completion.sh
          (cd release && sha256sum * > SHA256SUMS)

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: butler ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/butler.jar
            release/butler
            release/butler.service
            release/butler.sudoers
            release/butler_completion.sh
            release/SHA256SUMS
